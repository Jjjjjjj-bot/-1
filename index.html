<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>展覽心靈蘑菇測驗</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景微粒效果 */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            z-index: 1;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: var(--accent-color);
        }

        .header p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            display: none;
        }

        .question-card.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-title {
            font-size: 1.25rem;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        /* 1-14 題 Likert 選項 */
        .likert-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .likert-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .likert-btn:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-color);
            transform: translateX(4px);
        }

        /* 15 題 詞語網格 */
        .word-grid-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .word-count-badge {
            align-self: flex-end;
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .word-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        @media (max-width: 600px) {
            .word-grid { grid-template-columns: repeat(2, 1fr); }
            .container { padding: 20px; }
        }

        .word-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 10px 4px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.85rem;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .word-chip:hover {
            border-color: var(--accent-color);
        }

        .word-chip.selected {
            background: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            border-color: var(--accent-color);
        }

        .submit-btn {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .submit-btn:disabled {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
        }

        /* 結果展示頁面 */
        .result-box {
            text-align: center;
            display: none;
        }

        .result-box.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .mushroom-badge {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        .score-info {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="container">
        <div class="header" id="quizHeader">
            <h1>心靈蘑菇特質測驗</h1>
            <p>探索你的內在心理狀態與專屬心靈蘑菇原型</p>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- 題目容器 -->
        <div id="quizContent"></div>

        <!-- 結果頁面 -->
        <div class="result-box" id="resultCard">
            <div class="mushroom-badge" id="mushIcon">🍄</div>
            <h2 id="mushTitle" style="color: var(--accent-color); font-size: 1.8rem; margin-bottom: 15px;"></h2>
            <div class="score-info">
                WEMWBS 心靈健康得分：<strong id="totalScore" style="color: var(--accent-color); font-size: 1.4rem;">0</strong> / 70
            </div>
            <p id="mushDesc" style="line-height: 1.8; color: var(--text-sub); text-align: left; margin-top: 20px;"></p>
        </div>
    </div>

    <script>
        // 1. 填入你正式發布的 Web App URL
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPboMfvFFOP9EO6_dNrCMdT1O7z_LY_bemNcU7yLt6XpApFSyGF0bifn8Bzv4-PoGm/exec";

        // WEMWBS 14 題
        const wemwbsQuestions = [
            "1. 我對未來感到樂觀",
            "2. 我覺得自己有用",
            "3. 我感到放鬆",
            "4. 我對其他事物感興趣",
            "5. 我有足夠精力做出決定",
            "6. 我能清晰思考",
            "7. 我覺得自己表現良好",
            "8. 我對自己滿意",
            "9. 我覺得自己貼近他人",
            "10. 我感到自信",
            "11. 我能獨立思考與做出決定",
            "12. 我感到被愛",
            "13. 我對新事物感興趣",
            "14. 我感到心情愉快"
        ];

        const likertOptions = [
            { text: "完全沒有", score: 1 },
            { text: "很少有", score: 2 },
            { text: "有時有", score: 3 },
            { text: "經常有", score: 4 },
            { text: "總是有", score: 5 }
        ];

        // 50 個詞語陣列與對應蘑菇映射 (主權重 +2, 次權重 +1)
        const wordMatrix = [
            { word: "堅韌", main: "適應菇", sub: "力量菇" }, { word: "奉獻", main: "守護菇", sub: "溫暖菇" },
            { word: "擔當", main: "責任菇", sub: "守護菇" }, { word: "包容", main: "溫暖菇", sub: "和諧菇" },
            { word: "敏銳", main: "智慧菇", sub: "靈感菇" }, { word: "勇敢", main: "力量菇", sub: "冒險菇" },
            { word: "熱情", main: "活力菇", sub: "冒險菇" }, { word: "冷靜", main: "寧靜菇", sub: "智慧菇" },
            { word: "專注", main: "責任菇", sub: "智慧菇" }, { word: "溫柔", main: "溫暖菇", sub: "和諧菇" },
            { word: "獨立", main: "適應菇", sub: "力量菇" }, { word: "好奇", main: "靈感菇", sub: "冒險菇" },
            { word: "真誠", main: "和諧菇", sub: "溫暖菇" }, { word: "幽默", main: "活力菇", sub: "靈感菇" },
            { word: "沉穩", main: "寧靜菇", sub: "責任菇" }, { word: "果斷", main: "力量菇", sub: "責任菇" },
            { word: "體貼", main: "守護菇", sub: "溫暖菇" }, { word: "創新", main: "靈感菇", sub: "活力菇" },
            { word: "樂觀", main: "活力菇", sub: "和諧菇" }, { word: "嚴謹", main: "責任菇", sub: "智慧菇" },
            { word: "同理", main: "溫暖菇", sub: "守護菇" }, { word: "探索", main: "冒險菇", sub: "靈感菇" },
            { word: "和平", main: "和諧菇", sub: "寧靜菇" }, { word: "自信", main: "力量菇", sub: "適應菇" },
            { word: "睿智", main: "智慧菇", sub: "寧靜菇" }, { word: "彈性", main: "適應菇", sub: "和諧菇" },
            { word: "直覺", main: "靈感菇", sub: "智慧菇" }, { word: "耐性", main: "寧靜菇", sub: "守護菇" },
            { word: "陪伴", main: "守護菇", sub: "和諧菇" }, { word: "衝勁", main: "冒險菇", sub: "活力菇" },
            { word: "博學", main: "智慧菇", sub: "適應菇" }, { word: "謹慎", main: "責任菇", sub: "寧靜菇" },
            { word: "開朗", main: "活力菇", sub: "溫暖菇" }, { word: "靈動", main: "靈感菇", sub: "適應菇" },
            { word: "穩重", main: "寧靜菇", sub: "守護菇" }, { word: "無私", main: "守護菇", sub: "責任菇" },
            { word: "熱心", main: "溫暖菇", sub: "活力菇" }, { word: "理性", main: "智慧菇", sub: "責任菇" },
            { word: "隨和", main: "和諧菇", sub: "適應菇" }, { word: "突破", main: "冒險菇", sub: "力量菇" },
            { word: "定力", main: "寧靜菇", sub: "力量菇" }, { word: "滋養", main: "溫暖菇", sub: "守護菇" },
            { word: "創造", main: "靈感菇", sub: "冒險菇" }, { word: "分析", main: "智慧菇", sub: "責任菇" },
            { word: "堅定", main: "力量菇", sub: "適應菇" }, { word: "歡樂", main: "活力菇", sub: "和諧菇" },
            { word: "求變", main: "適應菇", sub: "冒險菇" }, { word: "協調", main: "和諧菇", sub: "守護菇" },
            { word: "庇護", main: "守護菇", sub: "寧靜菇" }, { word: "自由", main: "冒險菇", sub: "靈感菇" }
        ];

        const mushroomProfiles = {
            "適應菇": { icon: "🍄", desc: "環境變化越劇烈，你反而長得越堅韌。具有極高的心理彈性與環境應變能力。" },
            "守護菇": { icon: "🛡️", desc: "你是周遭朋友最安心的依靠，天生帶有保護與無私奉獻的溫暖特質。" },
            "責任菇": { icon: "⚖️", desc: "重視承諾與原則，做事嚴謹求實，是大家眼中最可靠的柱石。" },
            "溫暖菇": { icon: "☀️", desc: "擁有深厚的同理心，能敏銳察覺他人的情緒，給予恰到好處的慰藉。" },
            "智慧菇": { icon: "🦉", desc: "理性且洞察力強，習慣冷靜分析事物背後的本質與規律。" },
            "力量菇": { icon: "⚡", desc: "意志堅定，遇到挫折不輕易低頭，帶有強烈的個人自信與影響力。" },
            "活力菇": { icon: "🌟", desc: "像一顆小太陽，充滿熱情與樂觀能量，能迅速感染身邊的人。" },
            "寧靜菇": { icon: "🌊", desc: "心如止水，擁有沉穩的內在定力，在混亂的世界中依然能保持泰然。" },
            "靈感菇": { icon: "💡", desc: "直覺敏銳，思維靈動且富含創造力，總能從日常中發現獨特靈感。" },
            "和諧菇": { icon: "🌿", desc: "崇尚自然與和平，擅長協調人際關係，創造真誠融洽的氛圍。" },
            "冒險菇": { icon: "🚀", desc: "熱愛探索未知領域，勇於突破現狀，追尋自由與挑戰自我。" }
        };

        let currentQuestion = 0;
        let userAnswers = [];
        let selectedWords = [];

        // 初始化測驗
        function initQuiz() {
            const container = document.getElementById('quizContent');
            let html = '';

            // 前 14 題 HTML
            wemwbsQuestions.forEach((qText, index) => {
                html += `
                    <div class="question-card ${index === 0 ? 'active' : ''}" id="q${index}">
                        <div class="question-title">${qText}</div>
                        <div class="likert-options">
                            ${likertOptions.map(opt => `
                                <button class="likert-btn" onclick="selectLikert(${index}, ${opt.score})">${opt.text}</button>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            // 第 15 題 HTML
            html += `
                <div class="question-card" id="q14">
                    <div class="question-title">15. 請從下方詞語中，選出最能代表你特質的 <strong>10 個詞語</strong>：</div>
                    <div class="word-grid-container">
                        <div class="word-count-badge">已選擇 <span id="wordCount">0</span> / 10</div>
                        <div class="word-grid">
                            ${wordMatrix.map((item, idx) => `
                                <div class="word-chip" onclick="toggleWord(this, '${item.word}')">${item.word}</div>
                            `).join('')}
                        </div>
                        <button class="submit-btn" id="submitBtn" disabled onclick="calculateResult()">完成提交</button>
                    </div>
                </div>
            `;

            container.innerHTML = html;
            updateProgress();
        }

        function selectLikert(qIndex, score) {
            userAnswers[qIndex] = score;
            document.getElementById(`q${qIndex}`).classList.remove('active');
            
            currentQuestion++;
            document.getElementById(`q${currentQuestion}`).classList.add('active');
            updateProgress();
        }

        function toggleWord(element, word) {
            const index = selectedWords.indexOf(word);
            if (index > -1) {
                selectedWords.splice(index, 1);
                element.classList.remove('selected');
            } else {
                if (selectedWords.length < 10) {
                    selectedWords.push(word);
                    element.classList.add('selected');
                }
            }

            document.getElementById('wordCount').innerText = selectedWords.length;
            document.getElementById('submitBtn').disabled = selectedWords.length !== 10;
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / 15) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
        }

        // 計算結果與發送資料
        function calculateResult() {
            // 1. 計算 WEMWBS 總分
            const totalScore = userAnswers.reduce((a, b) => a + b, 0);

            // 2. 計算蘑菇型態分數 (主權重 +2, 次權重 +1)
            const mushroomScores = {};
            selectedWords.forEach(wordStr => {
                const match = wordMatrix.find(m => m.word === wordStr);
                if (match) {
                    mushroomScores[match.main] = (mushroomScores[match.main] || 0) + 2;
                    mushroomScores[match.sub] = (mushroomScores[match.sub] || 0) + 1;
                }
            });

            // 找出最高分蘑菇
            let topMushroom = "適應菇";
            let maxScore = -1;
            for (let mush in mushroomScores) {
                if (mushroomScores[mush] > maxScore) {
                    maxScore = mushroomScores[mush];
                    topMushroom = mush;
                }
            }

            // 3. 發送數據至 Google Sheet
            sendToGoogleSheets(totalScore, topMushroom, selectedWords.join(', '));

            // 4. 顯示結果 UI
            document.getElementById('quizContent').style.display = 'none';
            document.getElementById('progressBar').style.display = 'none';
            document.getElementById('quizHeader').style.display = 'none';

            const profile = mushroomProfiles[topMushroom] || mushroomProfiles["適應菇"];
            document.getElementById('mushIcon').innerText = profile.icon;
            document.getElementById('mushTitle').innerText = topMushroom;
            document.getElementById('totalScore').innerText = totalScore;
            document.getElementById('mushDesc').innerText = profile.desc;

            document.getElementById('resultCard').classList.add('active');
        }

        // 發送至 Google Apps Script Webhook
        function sendToGoogleSheets(totalScore, mushroomType, wordsStr) {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("YOUR_GOOGLE_APP_SCRIPT")) return;

            const payload = {
                timestamp: new Date().toLocaleString("zh-HK"),
                totalScore: totalScore,
                mushroomType: mushroomType,
                selectedWords: wordsStr,
                answers: userAnswers.join(",")
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(() => console.log("Success: Data sent"))
            .catch(err => console.error("Error:", err));
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
