<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>森林心靈菇菇生態測驗 (WEMWBS 15題完整版)</title>
    <style>
        :root {
            --primary-color: #3c6e38;
            --card-bg: rgba(255, 255, 255, 0.95);
            --accent-color: #e07a5f;
            --text-color: #2b2d42;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
            position: relative;
            overflow-x: hidden;
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.15);
            z-index: 0;
        }

        #particle-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 620px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #2d5a27;
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #668361;
            margin-bottom: 18px;
            font-weight: 500;
        }

        .progress-bar {
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 18px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .question-card { display: none; }
        .question-card.active { display: block; }

        .question-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #1b5e20;
            text-align: center;
        }

        .scenario {
            background-color: #f4f8f4;
            padding: 12px 15px;
            border-left: 4px solid var(--primary-color);
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.95rem;
            color: #333;
            text-align: center;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: white;
            border: 1.5px solid #dcdcdc;
            padding: 12px 15px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            color: #333;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        /* 第 15 題 10x5 詞語表格樣式 */
        .words-grid-container {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            padding: 10px 5px;
            backdrop-filter: blur(8px);
            margin-top: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
        }

        .words-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .words-table td {
            border: 1px solid rgba(120, 140, 120, 0.3);
            text-align: center;
            vertical-align: middle;
            padding: 6px 2px;
            height: 62px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.4);
        }

        .words-table td:hover {
            background: rgba(224, 242, 224, 0.8);
        }

        .words-table td.selected {
            background: #3c6e38 !important;
            color: #ffffff !important;
            font-weight: bold;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 2px;
            font-size: 0.85rem;
            margin: 0 auto;
            display: inline-block;
            color: #2c3e2e;
        }

        .words-table td.selected .vertical-text {
            color: #ffffff;
        }

        .word-counter {
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
            color: #e07a5f;
            margin: 12px 0 6px 0;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .nav-btn {
            padding: 9px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #466b5d;
            color: white;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .nav-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .submit-btn {
            padding: 10px 24px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .submit-btn:disabled {
            background: #e0b0a0;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .result-card { display: none; text-align: center; }

        .result-score {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent-color);
            margin: 10px 0 18px 0;
        }

        .mushroom-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2d5a27;
            margin-bottom: 12px;
        }

        .service-box {
            background: #fffafa;
            border: 1.5px dashed var(--accent-color);
            padding: 16px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="container">
    <h1>🍄 森林心靈菇菇生態測驗</h1>
    <div class="subtitle">15 題 WEMWBS & 詞語共鳴 探索你的內在狀態</div>

    <div id="quiz-section">
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <div id="questions-container"></div>

        <div class="btn-group">
            <button class="nav-btn" id="prev-btn" onclick="prevQuestion()" disabled>上一題</button>
            <span id="page-num" style="align-self: center; font-size: 0.85rem; color:#666;">1 / 15</span>
            <button class="submit-btn" id="submit-btn" style="display:none;" onclick="calculateResult()" disabled>完成提交</button>
        </div>
    </div>

    <div class="result-card" id="result-section">
        <h2>🎉 測驗完成！</h2>
        <div style="margin-top: 10px; color: #555;">你的心理養分指數 (WEMWBS 總分)：</div>
        <div class="result-score" id="total-score">0 / 70</div>

        <div class="mushroom-title" id="mushroom-name">分析中...</div>
        <p id="mushroom-desc" style="text-align: left; font-size: 0.95rem; color: #444; line-height: 1.6;"></p>

        <div class="service-box">
            <h3 style="margin-top:0; color: var(--accent-color); font-size: 1rem; margin-bottom: 8px;">🤝 建議尋找的【同行菇】與服務：</h3>
            <div id="companion-info" style="font-size: 0.9rem; line-height: 1.6; color: #444;"></div>
        </div>

        <button onclick="location.reload()" style="margin-top: 22px; padding: 10px 24px; background: #466b5d; color: white; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer;">重新測驗</button>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "YOUR_GOOGLE_APP_SCRIPT_WEBHOOK_URL";

    // 🌟 WEMWBS 14 題官方標準中文原版題目與 5 分 Likert 量表 🌟
    const wemwbsStandardOptions = [
        { text: "1分：從不 (None of the time)", score: 1 },
        { text: "2分：很少 (Rarely)", score: 2 },
        { text: "3分：有時 (Some of the time)", score: 3 },
        { text: "4分：經常 (Often)", score: 4 },
        { text: "5分：總是 (All of the time)", score: 5 }
    ];

    const questions = [
        { title: "【第 1 題】", scenario: "我對未來感到樂觀", options: wemwbsStandardOptions },
        { title: "【第 2 題】", scenario: "我覺得自己是個有用的人", options: wemwbsStandardOptions },
        { title: "【第 3 題】", scenario: "我覺得放鬆", options: wemwbsStandardOptions },
        { title: "【第 4 題】", scenario: "我對其他人感興趣", options: wemwbsStandardOptions },
        { title: "【第 5 題】", scenario: "我有充沛的精力", options: wemwbsStandardOptions },
        { title: "【第 6 題】", scenario: "我能很好地處理問題", options: wemwbsStandardOptions },
        { title: "【第 7 題】", scenario: "我的思緒清晰", options: wemwbsStandardOptions },
        { title: "【第 8 題】", scenario: "我對自己感到滿意", options: wemwbsStandardOptions },
        { title: "【第 9 題】", scenario: "我覺得自己與他人親近", options: wemwbsStandardOptions },
        { title: "【第 10 題】", scenario: "我覺得有自信", options: wemwbsStandardOptions },
        { title: "【第 11 題】", scenario: "我能獨立做決定", options: wemwbsStandardOptions },
        { title: "【第 12 題】", scenario: "我覺得自己被愛", options: wemwbsStandardOptions },
        { title: "【第 13 題】", scenario: "我對新事物感興趣", options: wemwbsStandardOptions },
        { title: "【第 14 題】", scenario: "我覺得愉快、開朗", options: wemwbsStandardOptions }
    ];

    // 🌟 第 15 題：50 個詞語陣列 (10 列 x 5 行) 🌟
    const gridWords = [
        ["堅韌", "奉獻", "擔當", "蓄力", "守護", "硬淨", "希望", "沉澱", "溫暖", "微光"],
        ["雲芝", "豐沛", "創作", "多元", "內斂", "親切", "優雅", "包容", "連結", "日常"],
        ["靈感", "睿智", "探索", "成長", "遠見", "體貼", "踏實", "百搭", "大方", "踏實"],
        ["深思", "顧家", "牽絆", "陪伴", "獨立", "幽默", "盡興", "彈性", "傾聽", "共情"],
        ["獨處", "典雅", "堅持", "自主", "隨和", "幸運", "靈活", "順從", "黏人", "親密"]
    ];

    // 🌟 10 種菇菇專屬詞語權重設定 (主權重 +2，副權重 +1) 🌟
    const wordWeights = {
        "堅韌": { main: "靈芝", sub: "夜光菇" }, "奉獻": { main: "靈芝", sub: "雞腿菇" }, "擔當": { main: "靈芝", sub: "猴頭菇" }, "蓄力": { main: "靈芝", sub: "夜光菇" }, "守護": { main: "靈芝", sub: "金針菇" },
        "雲芝": { main: "雲芝", sub: "竹笙" }, "豐沛": { main: "雲芝", sub: "蘑菇" }, "創作": { main: "雲芝", sub: "猴頭菇" }, "多元": { main: "雲芝", sub: "竹笙" }, "內斂": { main: "雲芝", sub: "松茸" }, "靈感": { main: "雲芝", sub: "猴頭菇" },
        "睿智": { main: "猴頭菇", sub: "松茸" }, "探索": { main: "猴頭菇", sub: "竹笙" }, "成長": { main: "猴頭菇", sub: "靈芝" }, "遠見": { main: "猴頭菇", sub: "雲芝" }, "深思": { main: "猴頭菇", sub: "松茸" },
        "顧家": { main: "金針菇", sub: "靈芝" }, "牽絆": { main: "金針菇", sub: "木耳" }, "陪伴": { main: "金針菇", sub: "雞腿菇" }, "黏人": { main: "金針菇", sub: "木耳" }, "親密": { main: "金針菇", sub: "竹笙" },
        "獨立": { main: "松茸", sub: "猴頭菇" }, "獨處": { main: "松茸", sub: "夜光菇" }, "典雅": { main: "松茸", sub: "竹笙" }, "堅持": { main: "松茸", sub: "靈芝" }, "自主": { main: "松茸", sub: "猴頭菇" },
        "體貼": { main: "雞腿菇", sub: "木耳" }, "幽默": { main: "雞腿菇", sub: "蘑菇" }, "隨和": { main: "雞腿菇", sub: "蘑菇" }, "幸運": { main: "雞腿菇", sub: "竹笙" }, "靈活": { main: "雞腿菇", sub: "雲芝" },
        "硬淨": { main: "夜光菇", sub: "靈芝" }, "希望": { main: "夜光菇", sub: "猴頭菇" }, "沉澱": { main: "夜光菇", sub: "松茸" }, "溫暖": { main: "夜光菇", sub: "雞腿菇" }, "微光": { main: "夜光菇", sub: "木耳" },
        "親切": { main: "竹笙", sub: "雞腿菇" }, "優雅": { main: "竹笙", sub: "松茸" }, "連結": { main: "竹笙", sub: "金針菇" }, "大方": { main: "竹笙", sub: "雲芝" },
        "包容": { main: "蘑菇", sub: "木耳" }, "日常": { main: "蘑菇", sub: "雞腿菇" }, "踏實": { main: "蘑菇", sub: "靈芝" }, "百搭": { main: "蘑菇", sub: "雞腿菇" },
        "盡興": { main: "木耳", sub: "雲芝" }, "彈性": { main: "木耳", sub: "雞腿菇" }, "傾聽": { main: "木耳", sub: "金針菇" }, "共情": { main: "木耳", sub: "竹笙" }, "順從": { main: "木耳", sub: "金針菇" }
    };

    let currentQ = 0;
    let answers = new Array(questions.length).fill(0);
    let selectedWords = [];

    function initQuiz() {
        const container = document.getElementById('questions-container');

        // 渲染前 14 題 WEMWBS
        questions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = `question-card ${idx === 0 ? 'active' : ''}`;
            card.id = `q-${idx}`;

            card.innerHTML = `
                <div class="question-title">${q.title}</div>
                <div class="scenario">「${q.scenario}」<br><span style="font-size:0.8rem; color:#666; font-weight:normal;">(請回想過去兩週內，這個描述符合你的頻率)</span></div>
                <div class="options">
                    ${q.options.map((opt) => `
                        <button class="option-btn" onclick="selectOption(${idx}, ${opt.score})">${opt.text}</button>
                    `).join('')}
                </div>
            `;
            container.appendChild(card);
        });

        // 渲染第 15 題 (網格詞語選取題)
        const q15Card = document.createElement('div');
        q15Card.className = 'question-card';
        q15Card.id = `q-14`;

        let gridHtml = `<div class="question-title">【第 15 題：與你的菇菇知己相認！】</div>`;
        gridHtml += `<div class="scenario">在以下的詞語庫中憑你的直覺選擇 <b>10 個</b>能代表你的字詞</div>`;
        gridHtml += `<div class="word-counter" id="word-counter">已選擇：0 / 10 個字詞</div>`;
        gridHtml += `<div class="words-grid-container"><table class="words-table">`;

        for (let r = 0; r < 5; r++) {
            gridHtml += `<tr>`;
            for (let c = 0; c < 10; c++) {
                const word = gridWords[r][c];
                gridHtml += `<td onclick="toggleWord(this, '${word}')"><span class="vertical-text">${word}</span></td>`;
            }
            gridHtml += `</tr>`;
        }
        gridHtml += `</table></div>`;

        q15Card.innerHTML = gridHtml;
        container.appendChild(q15Card);

        updateUI();
    }

    function toggleWord(tdElem, word) {
        const idx = selectedWords.indexOf(word);
        if (idx > -1) {
            selectedWords.splice(idx, 1);
            tdElem.classList.remove('selected');
        } else {
            if (selectedWords.length < 10) {
                selectedWords.push(word);
                tdElem.classList.add('selected');
            } else {
                alert("你已經選擇了 10 個字詞囉！如需替換，請先取消點選已選的字詞。");
            }
        }
        document.getElementById('word-counter').innerText = `已選擇：${selectedWords.length} / 10 個字詞`;
        document.getElementById('submit-btn').disabled = (selectedWords.length !== 10);
    }

    function selectOption(qIdx, score) {
        answers[qIdx] = score;
        if (currentQ < 14) {
            currentQ++;
            updateUI();
        }
    }

    function prevQuestion() {
        if (currentQ > 0) {
            currentQ--;
            updateUI();
        }
    }

    function updateUI() {
        document.querySelectorAll('.question-card').forEach((card, idx) => {
            card.classList.toggle('active', idx === currentQ);
        });

        document.getElementById('prev-btn').disabled = (currentQ === 0);
        document.getElementById('page-num').innerText = `${currentQ + 1} / 15`;
        document.getElementById('progress').style.width = `${((currentQ + 1) / 15) * 100}%`;

        if (currentQ === 14) {
            document.getElementById('submit-btn').style.display = 'block';
            document.getElementById('submit-btn').disabled = (selectedWords.length !== 10);
        } else {
            document.getElementById('submit-btn').style.display = 'none';
        }
    }

    function calculateResult() {
        const totalWemwbs = answers.reduce((a, b) => a + b, 0);

        let mushroomScores = {
            "木耳": 0, "靈芝": 0, "松茸": 0, "蘑菇": 0, "金針菇": 0,
            "雞腿菇": 0, "猴頭菇": 0, "竹笙": 0, "雲芝": 0, "夜光菇": 0
        };

        // 1. WEMWBS 基礎分數區間加權 (+5 分)
        if (totalWemwbs <= 18) mushroomScores["木耳"] += 5;
        else if (totalWemwbs <= 23) mushroomScores["靈芝"] += 5;
        else if (totalWemwbs <= 28) mushroomScores["松茸"] += 5;
        else if (totalWemwbs <= 32) mushroomScores["蘑菇"] += 5;
        else if (totalWemwbs <= 37) mushroomScores["金針菇"] += 5;
        else if (totalWemwbs <= 42) mushroomScores["雞腿菇"] += 5;
        else if (totalWemwbs <= 47) mushroomScores["猴頭菇"] += 5;
        else if (totalWemwbs <= 52) mushroomScores["竹笙"] += 5;
        else if (totalWemwbs <= 61) mushroomScores["雲芝"] += 5;
        else mushroomScores["夜光菇"] += 5;

        // 2. 第 15 題詞語主權重 (+2) 與副權重 (+1)
        selectedWords.forEach(w => {
            if (wordWeights[w]) {
                const mainMushroom = wordWeights[w].main;
                const subMushroom = wordWeights[w].sub;
                if (mushroomScores[mainMushroom] !== undefined) mushroomScores[mainMushroom] += 2;
                if (mushroomScores[subMushroom] !== undefined) mushroomScores[subMushroom] += 1;
            }
        });

        // 3. 判定最高分菇菇
        let finalMushroom = "木耳";
        let maxScore = -1;
        for (let m in mushroomScores) {
            if (mushroomScores[m] > maxScore) {
                maxScore = mushroomScores[m];
                finalMushroom = m;
            }
        }

        document.getElementById('quiz-section').style.display = 'none';
        document.getElementById('result-section').style.display = 'block';
        document.getElementById('total-score').innerText = `${totalWemwbs} / 70`;

        const mushroomData = {
            "木耳": {
                name: "👂 木耳 (傾聽型)",
                desc: "特質：共感敏銳、善於傾聽、情緒容器、適時卸載。你擁有極佳的同理心與包容力，但也因過度吸收他人的感受而需要空間淨化。",
                companion: "<b>🕊️【找】藝術治療 / 照顧者舒壓</b><br>你需要一雙溫柔的耳朵，專注聽你講述自己的故事，透過創作清空心靈負擔。"
            },
            "靈芝": {
                name: "🪵 靈芝 (修復型)",
                desc: "特質：堅韌擔當、默默守護、外剛內柔、記得愛己。你是大家可靠的後盾，但在展現強大保護力的同時，也別忘了溫柔對待自己。",
                companion: "<b>🫖【家】照顧者舒壓工作坊</b><br>給自己一段純粹放鬆的喘息時間，你有保護別人的硬殼，但也需要被溫柔滋養。"
            },
            "松茸": {
                name: "🌲 松茸 (獨立型)",
                desc: "特質：獨特自主、專注內在、堅持原則、尋求共鳴。你享受獨處並保有深刻的個人風格，有時渴望找到能真正理解你頻率的人。",

    function sendToGoogleSheets(totalScore, mushroomType, words) {
        if (GOOGLE_SCRIPT_URL === "YOUR_GOOGLE_APP_SCRIPT_WEBHOOK_URL") return;

        const data = {
            timestamp: new Date().toLocaleString("zh-HK"),
            totalScore: totalScore,
            mushroomType: mushroomType,
            selectedWords: words,
            answers: answers.slice(0, 14).join(",")
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        }).catch(err => console.log("Data send error:", err));
    }

    // 🌟 全版由上而下飄落螢光粒子 🌟
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor(isInitial = false) { this.reset(isInitial); }
        reset(isInitial = false) {
            this.x = Math.random() * canvas.width;
            this.y = isInitial ? Math.random() * canvas.height : -10;
            this.size = Math.random() * 3 + 1;
            this.speedY = Math.random() * 0.8 + 0.3;
            this.speedX = (Math.random() - 0.5) * 0.4;
            this.alpha = Math.random() * 0.8 + 0.2;
            this.fade = Math.random() * 0.005 + 0.002;
        }
        update() {
            this.y += this.speedY;
            this.x += this.speedX;
            this.alpha -= this.fade;
            if (this.alpha <= 0 || this.y > canvas.height) this.reset(false);
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 200, ${this.alpha})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = "rgba(255, 255, 150, 0.9)";
            ctx.fill();
        }
    }

    for (let i = 0; i < 60; i++) particles.push(new Particle(true));

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    animate();

    initQuiz();
</script>
