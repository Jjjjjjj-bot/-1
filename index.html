<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>森林心靈菇菇生態測驗 X 沃里克愛丁堡心理健康量表(WEMWBS）14題完整版)</title>
    <style>
        :root {
            --primary-color: #3c6e38;
            --card-bg: rgba(255, 255, 255, 0.95);
            --accent-color: #e07a5f;
            --text-color: #2b2d42;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
            position: relative;
            overflow-x: hidden;
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.15);
            z-index: 0;
        }

        #particle-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 620px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #2d5a27;
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #668361;
            margin-bottom: 18px;
            font-weight: 500;
        }

        /* 🍄 過渡介紹頁專用樣式 */
        .intro-card {
            text-align: center;
            padding: 10px 5px;
        }

        .intro-img {
            width: 100%;
            max-width: 520px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            margin: 0 auto 20px auto;
            display: block;
        }

        .start-btn {
            padding: 12px 36px;
            background: #466b5d;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(70, 107, 93, 0.3);
        }

        .start-btn:hover {
            background: #365348;
            transform: translateY(-2px);
        }

        .progress-bar {
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 18px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .question-card { display: none; }
        .question-card.active { display: block; }

        .question-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #1b5e20;
            text-align: center;
        }

        .scenario {
            background-color: #f4f8f4;
            padding: 12px 15px;
            border-left: 4px solid var(--primary-color);
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.95rem;
            color: #333;
            text-align: center;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: white;
            border: 1.5px solid #dcdcdc;
            padding: 12px 15px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            color: #333;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        /* 第 15 題 10x5 詞語表格樣式 */
        .words-grid-container {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            padding: 10px 5px;
            backdrop-filter: blur(8px);
            margin-top: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
        }

        .words-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .words-table td {
            border: 1px solid rgba(120, 140, 120, 0.3);
            text-align: center;
            vertical-align: middle;
            padding: 6px 2px;
            height: 62px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.4);
        }

        .words-table td:hover {
            background: rgba(224, 242, 224, 0.8);
        }

        .words-table td.selected {
            background: #3c6e38 !important;
            color: #ffffff !important;
            font-weight: bold;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 2px;
            font-size: 0.85rem;
            margin: 0 auto;
            display: inline-block;
            color: #2c3e2e;
        }

        .words-table td.selected .vertical-text {
            color: #ffffff;
        }

        .word-counter {
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
            color: #e07a5f;
            margin: 12px 0 6px 0;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .nav-btn {
            padding: 9px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #466b5d;
            color: white;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .nav-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .submit-btn {
            padding: 10px 24px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .submit-btn:disabled {
            background: #e0b0a0;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .result-card { display: none; text-align: center; }

        .result-score {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent-color);
            margin: 5px 0 15px 0;
        }

        /* 🍄 菇菇卡片樣式 */
        .mushroom-card-img
