<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>森林心靈菇菇生態測驗</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 10px;
      position: relative;
      overflow-x: hidden;
      /* 沉浸式森林光影背景 */
      background: radial-gradient(circle at 50% 30%, #528348 0%, #294e24 60%, #152b12 100%);
    }

    /* 漂浮螢光粒子 Canvas */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 第一版質感：大圓角卡片與陰影 */
    .container {
      position: relative;
      z-index: 2;
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      padding: 30px 25px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25), 0 0 15px rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* 標題區域 */
    h1 { color: #2e7d32; text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p.intro { color: #666; text-align: center; font-size: 13.5px; margin-bottom: 25px; }

    /* 第一版問題框樣式：柔和淺灰框、大圓角 */
    .question-card {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .question-title { font-weight: 600; margin-bottom: 12px; font-size: 15px; color: #1b5e20; line-height: 1.5; }
    .options { display: flex; flex-direction: column; gap: 8px; }
    
    /* 第一版選項按鈕樣式 */
    .option-btn {
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      color: #333;
      transition: all 0.2s ease;
    }
    .option-btn.selected {
      background: #e8f5e9;
      border-color: #4caf50;
      color: #2e7d32;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(76, 175, 80, 0.2);
    }

    /* 第一版綠色主提交按鈕 */
    #submit-btn {
      width: 100%;
      padding: 15px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    #submit-btn:hover { background: #1b5e20; }
    #submit-btn:disabled { background: #ccc; cursor: not-allowed; }

    /* 結果頁面 */
    #result-area { display: none; text-align: center; }
    .complete-badge { font-size: 20px; font-weight: 700; color: #2e7d32; margin-bottom: 15px; }
    .score-label { font-size: 13.5px; color: #555; margin-bottom: 5px; }
    .score-num { font-size: 36px; font-weight: 800; color: #e07a5f; margin-bottom: 15px; }
    .mushroom-type-title { font-size: 20px; font-weight: 700; color: #2e7d32; margin-bottom: 15px; }
    .mushroom-desc { font-size: 14px; color: #444; line-height: 1.6; text-align: left; margin-bottom: 20px; background: #f1f8e9; padding: 15px; border-radius: 12px; }

    /* 建議服務框 (橙紅色虛線框) */
    .referral-box {
      background: #fff8f5;
      border: 1.5px dashed #f2a68d;
      border-radius: 14px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
    }
    .referral-title { color: #e07a5f; font-weight: 700; font-size: 14.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .referral-item { font-size: 13.5px; color: #555; line-height: 1.5; }
    .referral-item strong { color: #2e7d32; display: block; margin-top: 4px; }

    .restart-btn {
      padding: 10px 24px;
      background: #4a6b46;
      color: white;
      border: none;
